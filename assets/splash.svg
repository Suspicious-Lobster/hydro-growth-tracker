<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Professional splash screen -->
  <defs>
    <linearGradient id="splashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="url(#splashBg)"/>
  
  <!-- Border -->
  <rect x="2" y="2" width="396" height="196" fill="none" stroke="#10b981" stroke-width="2"/>
  
  <!-- Main icon -->
  <g transform="translate(50, 50)">
    <circle cx="25" cy="25" r="25" fill="url(#titleGlow)" opacity="0.3"/>
    <circle cx="25" cy="25" r="20" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    
    <!-- Plant in container -->
    <rect x="18" y="35" width="14" height="8" rx="2" fill="#3b82f6"/>
    <rect x="24" y="25" width="2" height="15" fill="#059669"/>
    
    <!-- Leaves -->
    <ellipse cx="20" cy="27" rx="4" ry="2" fill="#10b981" transform="rotate(-30 20 27)"/>
    <ellipse cx="30" cy="27" rx="4" ry="2" fill="#10b981" transform="rotate(30 30 27)"/>
    <ellipse cx="25" cy="22" rx="3" ry="2" fill="#10b981"/>
    
    <!-- Growth indicator -->
    <circle cx="25" cy="18" r="2" fill="#34d399"/>
  </g>
  
  <!-- Title -->
  <text x="140" y="70" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#titleGlow)">
    HydroGrowth
  </text>
  <text x="140" y="95" font-family="Arial, sans-serif" font-size="16" fill="#64748b">
    Tracker Pro
  </text>
  
  <!-- Subtitle -->
  <text x="140" y="125" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">
    Professional Hydroponic Growth Monitoring
  </text>
  
  <!-- Version -->
  <text x="140" y="145" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    Version 1.0.0
  </text>
  
  <!-- Loading indicator -->
  <g transform="translate(340, 160)">
    <circle cx="0" cy="0" r="3" fill="#10b981">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="12" cy="0" r="3" fill="#10b981">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="24" cy="0" r="3" fill="#10b981">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
