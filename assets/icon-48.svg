<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Small desktop icon version -->
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="24" cy="24" r="22" fill="url(#iconBg)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Plant container -->
  <rect x="16" y="30" width="16" height="10" rx="2" fill="#3b82f6"/>
  
  <!-- Plant stem -->
  <rect x="23" y="22" width="2" height="12" fill="#059669"/>
  
  <!-- Leaves -->
  <ellipse cx="20" cy="24" rx="4" ry="2" fill="#10b981" transform="rotate(-30 20 24)"/>
  <ellipse cx="28" cy="24" rx="4" ry="2" fill="#10b981" transform="rotate(30 28 24)"/>
  <ellipse cx="24" cy="20" rx="3" ry="2" fill="#10b981"/>
  
  <!-- Growth indicator -->
  <circle cx="24" cy="16" r="2" fill="#34d399"/>
</svg>
