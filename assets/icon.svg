<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <dropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background rounded rectangle -->
  <rect x="16" y="16" width="224" height="224" rx="32" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Plant icon simplified -->
  <!-- Pot/container -->
  <rect x="96" y="160" width="64" height="48" rx="4" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Stem -->
  <rect x="126" y="120" width="4" height="48" fill="#059669"/>
  
  <!-- Leaves -->
  <ellipse cx="112" cy="130" rx="16" ry="8" fill="#10b981" transform="rotate(-25 112 130)"/>
  <ellipse cx="144" cy="130" rx="16" ry="8" fill="#10b981" transform="rotate(25 144 130)"/>
  <ellipse cx="128" cy="110" rx="12" ry="6" fill="#10b981"/>
  
  <!-- Growth/monitoring dots -->
  <circle cx="128" cy="90" r="4" fill="#34d399"/>
  <circle cx="180" cy="180" r="3" fill="#f59e0b"/>
  <circle cx="185" cy="175" r="2" fill="#ef4444"/>
  <circle cx="190" cy="180" r="2" fill="#10b981"/>
  
  <!-- App name -->
  <text x="128" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">HYDRO TRACKER</text>
</svg>
