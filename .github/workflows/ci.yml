name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two zones on opposite sides of UTC. Date-only strings used to parse
        # as UTC midnight, which rendered the previous day west of Greenwich
        # and picked tomorrow's date east of the dateline; both zones have to
        # stay green. (Node on Windows ignores TZ, so this only bites here.)
        tz: [America/Los_Angeles, Pacific/Auckland]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install only what the checks need. --ignore-scripts skips the Electron
      # binary download, which isn't required for lint/build/backend tests.
      - name: Install root dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Backend tests (vitest + coverage gate)
        run: npm test

      - name: Frontend unit and component tests
        run: npm run test:unit
        working-directory: frontend

      - name: Board lint
        run: python tools/board.py lint
